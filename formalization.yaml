version: "v0.4"

project:
  name: "Odd-ordered Cayley graphs satisfy Erdős–Gyárfás"
  description: >-
    Every Cayley graph of a finite group of odd order with an inverse-closed,
    identity-free generating set of size at least three contains a simple cycle
    of length 2^n for some n ≥ 2. For a noncyclic group of odd order, two such
    cycles can be chosen as translates meeting at exactly one vertex. A
    symmetric figure-eight lifts through an abelian normal subgroup of an
    odd-order group, and a power-of-two cycle lifts through a normal 2-subgroup
    of a finite group. The cycle conclusion also holds for finite nilpotent
    groups with a generating set satisfying the same degree condition.
  authors:
    - name: Michael C. Burkhart
      orcid: "0000-0002-2772-5840"
  responsible_maintainers:
    - name: Michael C. Burkhart
      orcid: "0000-0002-2772-5840"
  license: "Apache-2.0"

